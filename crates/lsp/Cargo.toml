[package]
name = "nwscript-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for NWScript"

[[bin]]
name = "nwscript-lsp"
path = "src/main.rs"

[dependencies]
nwscript-parser = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
ropey = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
